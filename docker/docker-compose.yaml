name: epic-freebies-helper

services:
  epic-freebies-helper:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: epic-freebies-helper:local
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      TZ: Asia/Shanghai
      ENABLE_APSCHEDULER: "true"
      HEADLESS: virtual
    volumes:
      - "./volumes/:/app/app/volumes/"
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["xvfb-run", "--auto-servernum", "--server-args=-screen 0, 1920x1080x24", "uv", "run", "--frozen", "app/deploy.py"]
    mem_limit: 4g
    shm_size: 2gb
